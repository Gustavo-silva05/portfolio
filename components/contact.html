<section class="section" id="contact">
    <div class="container">
        <h2 class="section__title">Get in Touch</h2>
        <p class="section__subtitle">Have a project in mind? I'd love to hear about it.</p>
        <form class="contact__form" novalidate>
            <div class="form__row">
                <div class="form__group">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="John Doe" required />
                </div>
                <div class="form__group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="john@example.com" required />
                </div>
            </div>
            <div class="form__group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" placeholder="Project enquiry" required />
            </div>
            <div class="form__group">
                <label for="message">Message</label>
                <textarea id="message" rows="5" placeholder="Tell me about your project..." required></textarea>
            </div>
            <button type="submit" class="btn btn--primary btn--full">Send Message</button>
            <p class="form__status" role="status" aria-live="polite"></p>
        </form>
        <div class="contact__social">
            <a href="https://github.com/Gustavo-silva05" target="_blank" rel="noopener noreferrer"
                class="social-link">GitHub</a>
            <a href="https://www.linkedin.com/in/gustavosouzasilva" target="_blank" rel="noopener noreferrer"
                class="social-link">LinkedIn</a>
            <a href="mailto:gus.ssilva05@gmail.com" class="social-link">Email</a>
        </div>
    </div>
</section>
